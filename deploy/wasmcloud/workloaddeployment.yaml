# wasmCloud v2 deployment manifests for geoint-playback.
#
# Two WorkloadDeployments that communicate over NATS (provided by the
# wasmcloud:messaging host plugin that ships with wasmCloud v2 hosts):
#   - geoint-playback-http:  http-api component.
#         Imports wasi:http/incoming-handler (for inbound HTTP) and
#         wasmcloud:messaging/consumer (for outbound request/reply to the task).
#   - geoint-playback-task:  task-insar component.
#         Exports wasmcloud:messaging/handler; subscribes to "tasks.insar".
#
# Ingress: the wasmCloud runtime-gateway (installed with the runtime-operator
# chart) listens on port 80 and routes by Host header to the component
# declaring a matching wasi:http config.host value — so requests reach
# http-api as: curl -H 'Host: geoint-playback.localhost.direct' http://localhost/
#
# Apply with: kubectl apply -f deploy/wasmcloud/workloaddeployment.yaml
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: geoint-playback-http
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: geoint-playback.localhost.direct
        - namespace: wasmcloud
          package: messaging
          version: "0.2.0"
          interfaces:
            - consumer
            - types
      components:
        - name: http-api
          image: ghcr.io/cosmonic-labs/geoint-playback/http-api:0.1.0
          localResources:
            allowedHosts:
              - "https://earth-search.aws.element84.com"
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: geoint-playback-task
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasmcloud
          package: messaging
          version: "0.2.0"
          interfaces:
            - handler
            - consumer
            - types
          config:
            subscriptions: "tasks.insar"
      components:
        - name: task-insar
          image: ghcr.io/cosmonic-labs/geoint-playback/task-insar:0.1.0
          poolSize: 1
