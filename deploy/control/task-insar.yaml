# Cosmonic Control WorkloadDeployment for the geoint-playback task-insar
# component. Subscribes to NATS subject "tasks.insar"; receives requests
# published by the http-api HTTPTrigger and replies on the reply subject.
#
# Apply with: kubectl apply -f deploy/control/task-insar.yaml
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: gp-taskinsar
  namespace: cosmonic-system
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: logging
          version: 0.1.0-draft
          interfaces:
            - logging
        - namespace: wasmcloud
          package: messaging
          version: "0.2.0"
          interfaces:
            - handler
            - consumer
            - types
          config:
            subscriptions: tasks.insar
      components:
        - name: task-insar
          image: ghcr.io/cosmonic-labs/geoint-playback/task-insar:0.1.0
          poolSize: 1
